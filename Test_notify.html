<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meet - Notification Setup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #efeae2;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            color: #00a884;
            margin-bottom: 20px;
        }
        p {
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #00a884;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔔 नोटिफिकेशन सेटअप</h2>
        <p>लाइव चैट अलर्ट प्राप्त करने के लिए अनुमति दें:</p>
        <button class="btn" onclick="requestNotificationPermission()">नोटिफिकेशन एनेबल करें</button>
        <div id="status"></div>
    </div>

    <!-- Firebase SDK & Config Scripts -->
    <script src="./config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        // Firebase ऐप इनिशियलाइज़ करें
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function requestNotificationPermission() {
            const statusDiv = document.getElementById("status");
            
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    statusDiv.innerText = "अनुमति मिल गई है, सर्विस वर्कर रजिस्टर हो रहा है...";
                    
                    // ब्राउज़र में सर्विस वर्कर को मैन्युअल रूप से रजिस्टर करें ताकि 404 एरर न आए
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.register('./firebase-messaging-sw.js')
                            .then((registration) => {
                                statusDiv.innerText = "टोकन जनरेट हो रहा है...";
                                const messaging = firebase.messaging();
                                
                                // रजिस्टर किए गए सर्विस वर्कर का उपयोग करके FCM टोकन प्राप्त करें
                                return messaging.getToken({ 
                                    vapidKey: VAPID_KEY,
                                    serviceWorkerRegistration: registration 
                                });
                            })
                            .then((currentToken) => {
                                if (currentToken) {
                                    // टोकन को फायरबेस डेटाबेस में सेव करें
                                    db.ref('fcm_tokens/').push({
                                        token: currentToken,
                                        timestamp: Date.now()
                                    });
                                    statusDiv.innerText = "सफलतापूर्वक नोटिफिकेशन चालू हो गया है!";
                                    console.log("FCM Token:", currentToken);
                                } else {
                                    statusDiv.innerText = "टोकन नहीं मिल पाया।";
                                }
                            })
                            .catch((err) => {
                                statusDiv.innerText = "त्रुटि: " + err.message;
                                console.error(err);
                            });
                    } else {
                        statusDiv.innerText = "आपका ब्राउज़र सर्विस वर्कर सपोर्ट नहीं करता।";
                    }
                } else {
                    statusDiv.innerText = "नोटिफिकेशन की अनुमति अस्वीकार कर दी गई है।";
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Meet (Admin)</title>
    <link rel="manifest" href="./A_manifest.json">
    <link rel="icon" href="./Ricon-192.png">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #efeae2;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }
        /* Sticky Top Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #005c4b;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .header-info {
            display: flex;
            flex-direction: column;
        }
        .header-title {
            font-size: 17px;
            font-weight: bold;
        }
        .status-text {
            font-size: 12px;
            color: #e0f2f1;
            margin-top: 2px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .action-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }
        /* Scrollable Chat Area */
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .incoming {
            background-color: white;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .outgoing {
            background-color: #d9fdd3;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .msg-time {
            display: block;
            font-size: 10px;
            color: #667781;
            text-align: right;
            margin-top: 4px;
        }
        /* Sticky Bottom Input Box */
        .input-container {
            position: sticky;
            bottom: 0;
            z-index: 100;
            display: flex;
            padding: 10px;
            background-color: #f0f2f5;
            align-items: center;
            box-shadow: 0 -1px 4px rgba(0,0,0,0.08);
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 24px;
            outline: none;
            font-size: 15px;
            background: white;
        }
        .send-btn {
            background-color: #005c4b;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-left: 8px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-info">
            <span class="header-title">Live 💬 Meet (Admin)</span>
            <span class="status-text" id="userStatus">Checking status...</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" id="notifyBtn" onclick="enableNotifications()">🔔 Alert On</button>
            <button class="action-btn" onclick="clearChat()">🗑️ Clear</button>
        </div>
    </div>

    <div class="chat-container" id="chatBox"></div>

    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Uttar likhein..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">Bhejein</button>
    </div>

    <!-- Firebase SDK & Config -->
    <script src="./config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const chatBox = document.getElementById("chatBox");
        const messageInput = document.getElementById("messageInput");
        const userStatus = document.getElementById("userStatus");
        const notifyBtn = document.getElementById("notifyBtn");

        const myRole = "admin";
        const otherRole = "user";
        const pageLoadTime = Date.now();
        let swRegistration = null;
        let typingTimeout = null;

        // 1. Service Worker Register (Relative Path './sw.js')
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => {
                    swRegistration = reg;
                    console.log('SW Registered');
                })
                .catch((err) => console.log('SW Error:', err));
        }

        if ('Notification' in window && Notification.permission === 'granted') {
            notifyBtn.style.display = 'none';
        }

        function enableNotifications() {
            if (!('Notification' in window)) {
                alert("Aapka browser notification support nahi karta.");
                return;
            }
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    notifyBtn.style.display = 'none';
                    showLocalNotification("Live Meet (Admin)", "Notifications chalu ho gaye hain!");
                }
            });
        }

        // 2. Browser Push Notification Function
        function showLocalNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                const options = {
                    body: body,
                    icon: './Ricon-192.png',
                    badge: './Ricon-192.png',
                    vibrate: [200, 100, 200],
                    tag: 'chat-msg',
                    renotify: true,
                    data: { url: './AtoG.html' }
                };
                if (swRegistration) {
                    swRegistration.showNotification(title, options);
                } else {
                    new Notification(title, options);
                }
            }
        }

        // 3. Admin ka Online Status Set Karna
        const myOnlineRef = db.ref('status/' + myRole);
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                myOnlineRef.onDisconnect().set({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
                myOnlineRef.set({ online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            }
        });

        // 4. User ka Online aur Typing Status Dekhna
        let isOtherOnline = false;
        let isOtherTyping = false;

        function updateHeaderStatus() {
            if (isOtherTyping) {
                userStatus.innerText = "User typing...";
                userStatus.style.color = "#ffeb3b";
            } else if (isOtherOnline) {
                userStatus.innerText = "● User Online";
                userStatus.style.color = "#d9fdd3";
            } else {
                userStatus.innerText = "User Offline";
                userStatus.style.color = "#e0f2f1";
            }
        }

        db.ref('status/' + otherRole).on('value', (snap) => {
            const data = snap.val();
            isOtherOnline = data ? data.online : false;
            updateHeaderStatus();
        });

        db.ref('typing/' + otherRole).on('value', (snap) => {
            isOtherTyping = snap.val() === true;
            updateHeaderStatus();
        });

        // 5. Typing Status Bhejna
        messageInput.addEventListener('input', () => {
            db.ref('typing/' + myRole).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                db.ref('typing/' + myRole).set(false);
            }, 1500);
        });

        // 6. Messages Load Karna + Notification Trigger
        db.ref('messages/').on('child_added', (snapshot) => {
            const msgData = snapshot.val();
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msgData.sender === myRole ? 'outgoing' : 'incoming'}`;

            const timeStr = msgData.timestamp 
                ? new Date(msgData.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
                : '';

            messageDiv.innerHTML = `<span>${msgData.text}</span><span class="msg-time">${timeStr}</span>`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Agar message User ne bheja hai aur naya hai, toh Admin ko Notification dikhao
            if (msgData.sender === otherRole && msgData.timestamp > pageLoadTime) {
                showLocalNotification("User का नया संदेश", msgData.text);
            }
        });

        // Chat clear hone par screen saaf karein
        db.ref('messages/').on('value', (snapshot) => {
            if (!snapshot.exists()) {
                chatBox.innerHTML = "";
            }
        });

        // 7. Message Send Karna
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            db.ref('messages/').push({
                text: text,
                sender: myRole,
                timestamp: Date.now()
            });

            db.ref('typing/' + myRole).set(false);
            messageInput.value = "";
            messageInput.focus();
        }

        // 8. Chat Clear Karne ka Function
        function clearChat() {
            if (confirm("Kya aap saare messages delete karna chahte hain?")) {
                db.ref('messages/').remove();
            }
        }

        messageInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
